# Supabase CLI settings for the shop's Edge Functions (supabase/SHOP.md).
# The gateway's JWT check is off for all four: Stripe calls the webhook without a
# Supabase JWT, checkout and downloads run for guests, and browsers send CORS preflights without one.
# Each function checks its own callers instead: the Stripe signature (stripe-webhook),
# rate limits and the checkout switch (shop-checkout), the emailed download token
# (shop-download), and the admin's access token against Supabase Auth plus shop_admins (shop-admin).
project_id = "organized-mom-collective"

[functions.shop-checkout]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.shop-admin]
verify_jwt = false

[functions.shop-download]
verify_jwt = false

# The /support form (guests, CORS preflights). Checks its own callers: validation, honeypot and
# rate limits in support_submit (supabase/SUPPORT.md).
[functions.support-request]
verify_jwt = false
