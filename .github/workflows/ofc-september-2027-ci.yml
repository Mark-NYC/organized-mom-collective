name: September Club preview verification
on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/club/September*.astro"
      - "src/pages/club/september-preview.astro"
      - "src/pages/club/kits/**"
      - "src/components/club/ClubMonthAccess.tsx"
      - "src/lib/family-calendar/**"
      - ".github/workflows/ofc-september-2027-ci.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test -- --run tests/club-september-2027.test.ts
