name: Fetch Kaboompics photos for review
# Kaboompics isn't reachable from Claude's cloud container, so photo requests are fetched here
# and committed back to the same branch for review. Research only: nothing is cleared for
# publication by this workflow (docs/brand/PHOTO-DISCOVERY.md).
on:
  workflow_dispatch:
  push:
    # Not on the base branch: merging a branch that carries a request would otherwise fetch it a
    # second time there and conflict with the results already committed on the branch.
    branches-ignore:
      - claude/exciting-ptolemy-v855xx
    paths:
      - 'docs/brand/photo-requests/*.json'
      - 'scripts/fetch_kaboompics.py'
      - '.github/workflows/kaboompics-fetch.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - name: Fetch every request without results yet
        run: |
          for f in docs/brand/photo-requests/*.json; do
            n=$(basename "$f" .json)
            if [ ! -f "design/photography/kaboompics/$n/manifest.json" ]; then
              python scripts/fetch_kaboompics.py "$f"
            fi
          done
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add design/photography/kaboompics
          git diff --cached --quiet || { git commit -m "Kaboompics review fetch (research only, not cleared)"; git push; }
