name: Install unique IF-07 Kaboompics photos
on:
  push:
    branches:
      - content/if-07-bathroom-chores-kids
    paths:
      - '.github/workflows/if-07-unique-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - name: Download licensed originals and export responsive images
        run: |
          python - <<'PY'
          import io, pathlib, urllib.request
          from PIL import Image, ImageOps
          sources = [
              ("if-07-bathroom-sink-hands", "https://kaboompics.com/download/ee3222afe7c5e4dbc2b0de71689944de/original", (640, 960, 1440), (5350, 3567)),
              ("if-07-bathroom-folded-towels", "https://kaboompics.com/download/4ffdc2c19c0afdd027de4d815664a45f/original", (400, 600, 800), (4379, 6569)),
          ]
          archive=pathlib.Path("design/photography/kaboompics/IF-07")
          output=pathlib.Path("public/images/resources")
          archive.mkdir(parents=True, exist_ok=True)
          output.mkdir(parents=True, exist_ok=True)
          for name, url, widths, expected in sources:
              request=urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (compatible; OrganizedMomCollectivePhotoArchive/1.0)"})
              with urllib.request.urlopen(request, timeout=90) as response:
                  raw=response.read()
              img=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert("RGB")
              if img.size != expected:
                  raise RuntimeError(f"{name}: unexpected source dimensions {img.size}, expected {expected}")
              (archive / (name+".jpg")).write_bytes(raw)
              for width in widths:
                  new_height=round(img.height * width / img.width)
                  dst=output / f"{name}-{width}.webp"
                  img.resize((width,new_height), Image.Resampling.LANCZOS).save(dst,"WEBP", quality=82, method=6,icc_profile=img.info.get("icc_profile",b""))
                  if not dst.is_file() or dst.stat().st_size < 4000: raise RuntimeError(f"Invalid output: {dst}")
                  print(dst, dst.stat().st_size)
          PY
      - name: Commit checked photo assets to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/photography/kaboompics/IF-07 public/images/resources/if-07-bathroom-*
          git diff --cached --quiet && exit 0
          git commit -m "Install two unique cleared Kaboompics photos for IF-07"
          git push
