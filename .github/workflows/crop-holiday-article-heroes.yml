name: Crop three holiday article hero images

on:
  push:
    branches:
      - crop-three-holiday-article-heroes-20261104
    paths:
      - '.github/workflows/crop-holiday-article-heroes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crop-three-holiday-article-heroes-20261104
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Crop and export responsive WebPs
        run: |
          python scripts/article-image.py design/photography/kaboompics/holiday-articles-2026-11/christmas-gift-wrapping-station-original.jpeg fp-28-wrapping-hero --crop 0,0.3055555556,1,0.75 --widths 640,960,1200
          python scripts/article-image.py design/photography/kaboompics/holiday-articles-2026-11/hot-cocoa-station-original.jpeg if-16-cocoa-hero --crop 0,0.2888888889,1,0.7333333333 --widths 640,960,1201
          python scripts/article-image.py design/photography/kaboompics/holiday-articles-2026-11/christmas-morning-organization-original.jpeg fp-29-christmas-hero --crop 0.1,0,1,1 --widths 640,900
          rm -f public/images/resources/fp-29-christmas-hero-960.webp public/images/resources/fp-29-christmas-hero-1000.webp
      - name: Verify all three hero images
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name, widths in {
              "fp-28-wrapping-hero": [640,960,1200],
              "if-16-cocoa-hero": [640,960,1201],
              "fp-29-christmas-hero": [640,900]
          }.items():
              for width in widths:
                  p=Path(f"public/images/resources/{name}-{width}.webp")
                  with Image.open(p) as image:
                      w,h=image.size
                      assert w==width and abs(w/h-1.5)<0.004, (p, image.size)
                      print(p, image.size)
          PY
      - name: Commit cropped assets to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/images/resources/fp-28-wrapping-hero-*.webp public/images/resources/if-16-cocoa-hero-*.webp public/images/resources/fp-29-christmas-hero-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Crop holiday article heroes to consistent 3:2"
            git fetch origin crop-three-holiday-article-heroes-20261104
            git rebase origin/crop-three-holiday-article-heroes-20261104
            git push origin HEAD:crop-three-holiday-article-heroes-20261104
          fi
