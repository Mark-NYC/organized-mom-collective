# Production database backup (docs/operations/DATABASE_BACKUPS.md). Supabase Free plan: Supabase keeps no backups.
#
# backup   daily, by hand (Actions → Database backup → Run workflow), or a push to a claude/** branch whose commit
#          message contains [db-backup] and touches .github/db-backup-request. Reads production only. Dumps roles,
#          schema, data (with auth users) and migration history with `supabase db dump`, encrypts with age, uploads to
#          private S3-compatible storage (Cloudflare R2), downloads it back, decrypts it, restores it into a throwaway
#          local Supabase on the runner and checks every table's row count and the structure. Only then is it marked
#          VERIFIED; the newest 30 verified backups are kept. No artifacts; logs hold names and counts only.
# selftest the same pipeline against a throwaway source database (no production, no secrets), on changes to it.
# notify   opens (or updates) a GitHub issue when a backup fails, and closes it after the next good one.
name: Database backup
on:
  schedule:
    - cron: '17 7 * * *'   # 07:17 UTC daily (about 2–3 am in New York)
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why (e.g. before Session B)'
        required: false
        default: manual
  push:
    branches: ['claude/**']
    paths: ['scripts/db-backup/**', '.github/workflows/db-backup.yml', '.github/db-backup-request']
  pull_request:
    paths: ['scripts/db-backup/**', '.github/workflows/db-backup.yml']
concurrency:
  group: db-backup
  cancel-in-progress: false
permissions:
  contents: read
env:
  KEEP: 30
  # A pinned version: "latest" asks GitHub's API, which rate-limits. Raise it when a restore check reports that
  # production's auth or storage tables are newer than the local Supabase (DATABASE_BACKUPS.md → When a backup fails).
  SUPABASE_CLI: 3.2.0

jobs:
  selftest:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Work folder
        run: echo "T=$RUNNER_TEMP/selftest" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI }}
      - name: Tools (age, Postgres 17 client)
        run: bash scripts/db-backup/tools.sh
      - name: A throwaway source database with every kind of thing a real backup carries
        run: |
          mkdir -p "${T:?}"
          echo "SRC_URL=$(bash scripts/db-backup/local-stack.sh up "${T:?}/source")" >> "$GITHUB_ENV"
      - name: Seed it (test data only)
        run: psql "$SRC_URL" -X -q -v ON_ERROR_STOP=1 -f scripts/db-backup/selftest-seed.sql
      - name: Back it up
        run: OUT="${T:?}/plain" LOGS="${T:?}/logs" bash scripts/db-backup/dump.sh
      - name: Encrypt (throwaway key)
        run: |
          age-keygen -o "${T:?}/test.key" 2>/dev/null
          tar -C "${T:?}/plain" -cf - . | age -r "$(age-keygen -y "${T:?}/test.key")" > "${T:?}/backup.tar.age"
          echo "SHA=$(sha256sum "${T:?}/backup.tar.age" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Private storage round trip and retention (a local S3-compatible server; the same store.sh and AWS CLI as production)
        env:
          BACKUP_S3_ENDPOINT: http://127.0.0.1:9000
          BACKUP_S3_BUCKET: omc-db-backups
          AWS_ACCESS_KEY_ID: selftest
          AWS_SECRET_ACCESS_KEY: selftest-only-secret
        run: |
          python3 -m venv "${T:?}/s3venv" && "${T:?}/s3venv/bin/pip" install -q "moto[server]"
          ("${T:?}/s3venv/bin/moto_server" -H 127.0.0.1 -p 9000 >"${T:?}/s3.log" 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
          AWS_DEFAULT_REGION=us-east-1 aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3api create-bucket --bucket "$BACKUP_S3_BUCKET" >/dev/null
          stamp=20991231T000000Z
          bash scripts/db-backup/store.sh put "${T:?}/backup.tar.age" "backups/$stamp/backup.tar.age"
          bash scripts/db-backup/store.sh get "backups/$stamp/backup.tar.age" "${T:?}/fetched.tar.age"
          [ "$(sha256sum "${T:?}/fetched.tar.age" | cut -d' ' -f1)" = "$SHA" ] && echo "stored copy: checksum matches"
          mkdir "${T:?}/files"
          age -d -i "${T:?}/test.key" "${T:?}/fetched.tar.age" | tar -x -C "${T:?}/files"
          cmp <(cd "${T:?}/plain" && sha256sum *) <(cd "${T:?}/files" && sha256sum *) && echo "decrypted copy identical to the dump"
          # Retention: 9 older verified backups and 1 unverified one; keep 7 → the 3 oldest verified go, the newest stays.
          date > "${T:?}/marker"
          for d in 20990101 20990102 20990103 20990104 20990105 20990106 20990107 20990108 20990109; do
            bash scripts/db-backup/store.sh put "${T:?}/marker" "backups/${d}T000000Z/VERIFIED"
          done
          bash scripts/db-backup/store.sh put "${T:?}/marker" "backups/20990110T000000Z/backup.tar.age"
          bash scripts/db-backup/store.sh put "${T:?}/marker" "backups/$stamp/VERIFIED"
          bash scripts/db-backup/store.sh prune 7
          left=$(bash scripts/db-backup/store.sh list | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "left: $left"
          [ "$left" = "20990104T000000Z 20990105T000000Z 20990106T000000Z 20990107T000000Z 20990108T000000Z 20990109T000000Z 20990110T000000Z $stamp " ] && echo "retention correct"
      - name: Remove the source; restore the downloaded copy into a fresh, empty database and verify
        run: |
          bash scripts/db-backup/local-stack.sh down "${T:?}/source"
          url=$(bash scripts/db-backup/local-stack.sh up "${T:?}/target")
          echo "TARGET_URL=$url" >> "$GITHUB_ENV"
          DIR="${T:?}/files" TARGET_URL="$url" LOGS="${T:?}/logs" bash scripts/db-backup/verify-restore.sh
      - name: A failing restore never prints customer data
        run: |
          source scripts/db-backup/common.sh
          LOGS="${T:?}/logs"
          # Real Postgres errors that quote a row: a duplicate key (DETAIL) and a bad COPY row (CONTEXT).
          out=$( { quiet leak-test-1 psql "$TARGET_URL" -X -v ON_ERROR_STOP=1 -c "create temp table t (email text unique); insert into t values ('selftest1@example.com'), ('selftest1@example.com')"; \
                   quiet leak-test-2 psql "$TARGET_URL" -X -v ON_ERROR_STOP=1 -f "${T:?}/files/data.sql"; } 2>&1 || true)
          echo "$out"
          if grep -qiE '@example\.com|Family [0-9]|line one' <<<"$out"; then echo "::error::customer-like data reached the log"; exit 1; fi
          grep -q 'FAILED: leak-test-1' <<<"$out" && grep -q 'FAILED: leak-test-2' <<<"$out" && echo "both errors reported, no data in them"
      - name: Clean up
        if: always()
        run: |
          pkill -f moto_server || true
          if [ -n "${T:-}" ]; then
            bash scripts/db-backup/local-stack.sh down "${T:?}/target" || true
            rm -rf -- "${T:?}"
          fi

  backup:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[db-backup]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SRC_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_AGE_SECRET_KEY: ${{ secrets.BACKUP_AGE_SECRET_KEY }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      REASON: ${{ github.event.inputs.reason || github.event_name }}
    steps:
      - name: The six backup secrets are set
        run: |
          missing=""
          for v in SRC_URL BACKUP_AGE_SECRET_KEY BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Missing backup secrets:$missing (docs/operations/DATABASE_BACKUPS.md → Setup)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI }}
      - name: Tools (age, Postgres 17 client)
        run: bash scripts/db-backup/tools.sh
      - name: Hide the connection details from the log; prepare the key
        run: |
          source scripts/db-backup/common.sh
          mask_url "$SRC_URL"
          W="$RUNNER_TEMP/backup"; echo "W=$W" >> "$GITHUB_ENV"
          mkdir -p "${W:?}"; chmod 700 "${W:?}"
          printf '%s\n' "$BACKUP_AGE_SECRET_KEY" > "${W:?}/age.key"; chmod 600 "${W:?}/age.key"
          age-keygen -y "${W:?}/age.key" > "${W:?}/age.pub" 2>/dev/null || { echo "::error::BACKUP_AGE_SECRET_KEY isn't an age secret key"; exit 1; }
          echo "STAMP=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"
      - name: Dump production (read-only)
        run: OUT="${W:?}/plain" LOGS="${W:?}/logs" bash scripts/db-backup/dump.sh
      - name: Encrypt
        run: |
          tar -C "${W:?}/plain" -cf - . | age -r "$(cat "${W:?}/age.pub")" > "${W:?}/backup.tar.age"
          rm -rf -- "${W:?}/plain"
          echo "SHA=$(sha256sum "${W:?}/backup.tar.age" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SIZE=$(stat -c %s "${W:?}/backup.tar.age")" >> "$GITHUB_ENV"
      - name: Upload to private storage
        run: |
          python3 -c 'import json,os; print(json.dumps({"stamp": os.environ["STAMP"], "reason": os.environ["REASON"], "commit": os.environ["GITHUB_SHA"],
                      "bytes": int(os.environ["SIZE"]), "sha256": os.environ["SHA"], "encryption": "age", "verified": False}))' > "${W:?}/manifest.json"
          bash scripts/db-backup/store.sh put "${W:?}/backup.tar.age" "backups/$STAMP/backup.tar.age"
          bash scripts/db-backup/store.sh put "${W:?}/manifest.json" "backups/$STAMP/manifest.json"
      - name: Download it back, check it, decrypt it
        run: |
          mkdir -p "${W:?}/fetched" "${W:?}/files"
          bash scripts/db-backup/store.sh get "backups/$STAMP/backup.tar.age" "${W:?}/fetched/backup.tar.age"
          [ "$(sha256sum "${W:?}/fetched/backup.tar.age" | cut -d' ' -f1)" = "$SHA" ] || { echo "::error::The stored copy differs from what was uploaded"; exit 1; }
          age -d -i "${W:?}/age.key" "${W:?}/fetched/backup.tar.age" | tar -x -C "${W:?}/files"
          echo "stored copy: checksum matches, decrypts"
      - name: Restore it into a throwaway local Supabase and verify
        run: |
          url=$(bash scripts/db-backup/local-stack.sh up "${W:?}/stack")
          DIR="${W:?}/files" TARGET_URL="$url" LOGS="${W:?}/logs" bash scripts/db-backup/verify-restore.sh | tee "${W:?}/verify.txt"
      - name: Mark verified; apply retention
        run: |
          python3 -c 'import json,os,datetime; p=os.environ["W"]+"/manifest.json"; m=json.load(open(p)); m.update(verified=True, verified_at=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")); json.dump(m, open(p,"w"))'
          bash scripts/db-backup/store.sh put "${W:?}/manifest.json" "backups/$STAMP/manifest.json"
          date -u +%FT%TZ > "${W:?}/VERIFIED"
          bash scripts/db-backup/store.sh put "${W:?}/VERIFIED" "backups/$STAMP/VERIFIED"
          bash scripts/db-backup/store.sh prune "$KEEP" | tee "${W:?}/retention.txt"
      - name: Summary (names and counts only)
        run: |
          {
            echo "### Database backup $STAMP: verified"
            echo "- Stored: \`backups/$STAMP/backup.tar.age\` ($(numfmt --to=iec "$SIZE")), sha256 \`${SHA:0:16}…\`, encrypted with age"
            echo "- $(head -1 "${W:?}/verify.txt")"
            echo "- $(cat "${W:?}/retention.txt")"
            echo; echo '```'; tail -n +2 "${W:?}/verify.txt"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up
        if: always()
        run: |
          if [ -n "${W:-}" ]; then
            bash scripts/db-backup/local-stack.sh down "${W:?}/stack" || true
            rm -rf -- "${W:?}"
          fi

  notify:
    needs: backup
    if: always() && needs.backup.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.backup.result }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          label=db-backup-failure
          open=$(gh issue list --label "$label" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then gh issue close "$open" --comment "Recovered: the backup of $(date -u +%FT%TZ) was verified ($RUN)."; fi
            exit 0
          fi
          gh label create "$label" --color B60205 --description "The production database backup failed" 2>/dev/null || true
          msg="The production database backup did not complete ($RESULT) at $(date -u +%FT%TZ): $RUN"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$msg"
          else
            gh issue create --label "$label" --title "Database backup failed" --body "@Mark-NYC $msg

          Until a backup is verified again, don't apply migrations. What to check: docs/operations/DATABASE_BACKUPS.md → When a backup fails."
          fi
