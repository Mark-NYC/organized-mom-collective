name: Verify Astro build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Catch invalid JavaScript in PDF and asset scripts before the expensive build.
      - name: Check script syntax
        run: find scripts -type f \( -name '*.mjs' -o -name '*.cjs' -o -name '*.js' \) -print0 | xargs -0 -r -n 1 node --check
      # Exactly match the production Pages build command. Includes asset generation,
      # artwork audit, Astro diagnostics and Astro production compilation.
      - name: Production-equivalent build
        run: npm run build
      # Both build AND unit tests must pass on the same PR head.
      - name: Unit tests
        run: npm test
