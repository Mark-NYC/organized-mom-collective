# Signed build of the iPhone app, uploaded to TestFlight. Runs ONLY when someone starts it by hand
# (Actions → iPhone app: TestFlight → Run workflow). Never on a push. docs/ios/TESTFLIGHT.md has the one-time setup.
#
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   the 10-character team id (developer.apple.com → Membership)
#   ASC_KEY_ID      App Store Connect API key id        (App Store Connect → Users and Access → Integrations)
#   ASC_ISSUER_ID   the issuer id shown on the same page
#   ASC_KEY_P8      the whole contents of the downloaded AuthKey_XXXX.p8 file (role: Admin, so Xcode can manage signing)
# The app talks to the production Supabase project (src/lib/supabase-config.ts): the family features work on a
# phone only once the household migrations are applied there (docs/ios/MIGRATION_DEPLOYMENT_PLAN.md).
name: 'iPhone app: TestFlight'
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown in TestFlight (e.g. 1.0)'
        default: '1.0'
        required: true
concurrency:
  group: ios-testflight
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: The four Apple secrets are set
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (docs/ios/TESTFLIGHT.md)"; exit 1; fi
          case "$VERSION" in *[!0-9.]*|'') echo "::error::Version must look like 1.0"; exit 1 ;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build the app bundle (fails on a leaked page, tracking tag or secret)
        run: npm run build:app
      - run: npx cap sync ios
      - name: App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Archive (Release, signed by Xcode with the API key)
        run: |
          set -o pipefail
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/OrganizedFamily.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tail -n 60
      - name: Upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OrganizedFamily.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 60
          echo "Uploaded Organized Family $VERSION (build ${{ github.run_number }}). It shows in TestFlight after Apple's processing (usually 10-30 minutes)." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
