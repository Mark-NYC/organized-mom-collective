name: Convert chore icon backgrounds
on:
  push:
    branches: [main]
    paths:
      - scripts/convert-chore-jpgs.py
      - assets/icons/ofc/updatedicons/svg/clothes-in-hamper.jpg
      - assets/icons/ofc/updatedicons/svg/sort-laundry.jpg
      - assets/icons/ofc/updatedicons/svg/dust-furniture.jpg
      - assets/icons/ofc/updatedicons/svg/tidy-living-room.jpg
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12' 'numpy>=1.26,<3'
      - run: python scripts/convert-chore-jpgs.py
      - name: Commit transparent files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icons/ofc/updatedicons/svg/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add transparent chore WebP icons"
            git push
          fi
