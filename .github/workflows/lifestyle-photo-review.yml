name: Build lifestyle photo review sheet
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/build_photo_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: lifestyle-photo-review
          path: photo-library-review/
          retention-days: 14
