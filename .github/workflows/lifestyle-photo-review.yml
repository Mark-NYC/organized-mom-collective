name: Build OMC photo comparison sheets
on:
  workflow_dispatch:
  push:
    branches:
      - photo-library-pilot-2026-10
    paths:
      - '.github/workflows/lifestyle-photo-review.yml'
      - 'scripts/build_photo_review.py'
      - 'scripts/validate_photo_review.py'
      - 'scripts/validate_photo_catalog.py'
      - 'docs/brand/lifestyle-photo-library.json'
      - 'docs/brand/faces-approval-batch-02.json'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python -m py_compile scripts/build_photo_review.py scripts/validate_photo_review.py
      - run: python scripts/validate_photo_catalog.py
      - run: python scripts/build_photo_review.py
      - run: python scripts/validate_photo_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omc-photo-style-comparison
          path: photo-library-review/
          retention-days: 14
