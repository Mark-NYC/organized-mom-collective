<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792" role="img" aria-label="Family Laundry System printable cover">
<rect width="612" height="792" fill="#fff"/>
<text x="42" y="39" font-family="Montserrat,Arial,sans-serif" font-size="13" font-weight="700" fill="#545454" letter-spacing="3">ORGANIZED MOM COLLECTIVE</text>
<rect x="42" y="53" width="528" height="9" fill="#CDDDE1"/>
<text x="42" y="102" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#545454">01 / LAUNDRY THAT MOVES</text>
<text x="42" y="158" font-family="Georgia,serif" font-size="37" font-weight="bold" fill="#545454">From Hamper to Drawer</text>
<text x="42" y="190" font-family="Montserrat,Arial,sans-serif" font-size="14" fill="#545454">Five clear steps. Everyone knows their part.</text>
<rect x="42" y="225" width="528" height="60" fill="#FBF7F1"/>
<text x="58" y="249" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="700" fill="#545454">WHAT FINISHED LOOKS LIKE</text>
<text x="58" y="270" font-family="Montserrat,Arial,sans-serif" font-size="13" fill="#545454">The clean clothes are put away, not piled up.</text>
<g font-family="Montserrat,Arial,sans-serif" fill="#545454">
<text x="55" y="329" font-family="Georgia,serif" font-size="26">01</text><text x="128" y="319" font-size="17" font-weight="700">Collect</text><text x="128" y="338" font-size="12">Worn clothes go straight in the hamper.</text>
<path d="M42 361H570" stroke="#D8D1CB"/>
<text x="55" y="394" font-family="Georgia,serif" font-size="26">02</text><text x="128" y="386" font-size="17" font-weight="700">Sort + prepare</text><text x="128" y="405" font-size="12">Empty pockets, check labels, separate delicates.</text>
<path d="M42 430H570" stroke="#D8D1CB"/>
<text x="55" y="463" font-family="Georgia,serif" font-size="26">03</text><text x="128" y="455" font-size="17" font-weight="700">Wash + move</text><text x="128" y="474" font-size="12">Run a load; set a timer to transfer it.</text>
<path d="M42 499H570" stroke="#D8D1CB"/>
<text x="55" y="532" font-family="Georgia,serif" font-size="26">04</text><text x="128" y="524" font-size="17" font-weight="700">Fold + sort</text><text x="128" y="543" font-size="12">One pile or clean basket per person.</text>
<path d="M42 568H570" stroke="#D8D1CB"/>
<text x="55" y="601" font-family="Georgia,serif" font-size="26">05</text><text x="128" y="593" font-size="17" font-weight="700">Put away</text><text x="128" y="612" font-size="12">Everyone returns their clothes to a home.</text>
</g>
<rect x="42" y="651" width="528" height="75" fill="#CDDDE1"/>
<text x="56" y="677" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="700" fill="#545454">START HERE</text>
<text x="56" y="699" font-family="Montserrat,Arial,sans-serif" font-size="12" fill="#545454">Practice one complete load before changing the schedule.</text>
<path d="M42 756H570" stroke="#D8D1CB"/>
<text x="42" y="773" font-family="Montserrat,Arial,sans-serif" font-size="10" font-weight="700" fill="#545454">SMALL HABITS. SHARED RESPONSIBILITY.</text>
</svg>