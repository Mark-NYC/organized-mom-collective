as</text><rect x="324" y="303" width="13" height="13" rx="3" fill="none" stroke="#A89B8F"/><text x="349" y="316" font-family="Montserrat,Arial,sans-serif" font-size="14" fill="#343434">Tongs</text><rect x="324" y="342" width="13" height="13" rx="3" fill="none" stroke="#A89B8F"/><text x="349" y="355" font-family="Montserrat,Arial,sans-serif" font-size="14" fill="#343434">Ladles</text><rect x="57" y="408" width="239" height="30" rx="5" fill="#A89B8F"/><text x="69" y="428" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="700" fill="white">SMALL APPLIANCES</text><rect x="65" y="453" width="13" height="13" rx="3" fill="none" stroke="#A89B8F"/><text x="90" y="466" font-family="Montserrat,Arial,sans-serif" font-size="14" fill="#343434">Toaster</text><rect x="65" y="492" width="13" height="13" rx="3" fill="none" stroke="#A89B8F"/><text x="90" y="505" font-family="Montserrat,Arial,sans-serif" font-size="14" fill="#343434">Blender</text><rect x="65" y="531" width="13" height="13" rx="3" fill="none" stroke="#A89B8F"/><text x="90" y="544" font-family="Montserrat,Arial,sans-serif" font-size="14" fill="#343434">Coffee Maker</text><rect x="316" y="408" width="239" height="30" rx="5" fill="#A89B8F"/><text x="328" y="428" font-family="Montserrat,Arial,sans-serif" font-size="12" font-weight="700" fill="white">ODD ENDS</text><rect x="324" y="453" width="13" height="13" rx="3" fill="none" stroke="#A89B8F"/><text x="349" y="466" font-family="Montserrat,Arial,sans-serif" font-size="14" fill="#343434">Keys</text><rect x="324" y="492" width="13" height="13" rx="3" fill="none" stroke="#A89B8F"/><text x="349" y="505" font-family="Montserrat,Arial,sans-serif" font-size="14" fill="#343434">Change</text><rect x="324" y="531" width="13" height="13" rx="3" fill="none" stroke="#A89B8F"/><text x="349" y="544" font-family="Montserrat,Arial,sans-serif" font-size="14" fill="#343434">Elastic Bands</text><path d="M57 632H555" stroke="#D5C5B8"/><text x="57" y="653" font-family="Monts